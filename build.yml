name: Compilar mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: itemedit-mod
          path: build/libs/itemedit-1.0.0.jar
